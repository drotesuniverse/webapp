<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samurai Wisdom</title>

    <!-- Google Font Oswald -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Oswald', sans-serif; }
        body {
            background:#0a0a0a; color:#f0f0f0;
            min-height:100vh; display:flex; flex-direction:column;
            align-items:center; justify-content:center; padding:20px;
            position:relative; overflow-x:hidden;
        }
        .background-image {
            position:absolute; top:0; left:0; width:100%; height:100%;
            background-size:cover; background-position:center; opacity:0.4; z-index:-1;
            transition: background-image 1.5s ease-in-out;
        }
        .container { max-width:900px; width:100%; text-align:center; z-index:1; margin:auto; display:flex; flex-direction:column; justify-content:center; align-items:center; flex:1; }
        .quote-box {
            background: rgba(20,20,20,0.7); border-radius:16px; padding:60px 40px;
            margin-bottom:20px; box-shadow:0 10px 30px rgba(0,0,0,0.5); border:1px solid rgba(100,100,100,0.2);
            position:relative; overflow:hidden; backdrop-filter:blur(5px); width:100%; max-width:800px;
        }
        .quote-box::before {
            content:""; position:absolute; top:0; left:0; width:100%; height:4px;
            background:linear-gradient(90deg,#8B0000,#B22222,#8B0000);
        }
        .quote-text { font-size:2.2rem; line-height:1.4; margin-bottom:30px; font-weight:300; color:#f8f8f8; text-shadow:0 2px 4px rgba(0,0,0,0.5);}
        .quote-author { font-size:1.3rem; color:#B22222; font-style:italic; font-weight:400; text-shadow:0 1px 2px rgba(0,0,0,0.5);}
        .video-container {
            width:100%; max-width:800px; background:rgba(20,20,20,0.7); border-radius:16px;
            padding:20px; margin-bottom:20px; box-shadow:0 10px 30px rgba(0,0,0,0.5);
            border:1px solid rgba(100,100,100,0.2); backdrop-filter:blur(5px); position:relative;
        }
        .video-container::before {
            content:""; position:absolute; top:0; left:0; width:100%; height:4px;
            background:linear-gradient(90deg,#8B0000,#B22222,#8B0000);
        }
        .motivational-video { width:100%; border-radius:8px; max-height:450px; }
        .branding-bottom { padding:20px; text-align:center; margin-top:auto; }
        .brand-logo-bottom { font-size:1.8rem; font-weight:700; letter-spacing:3px; color:#f0f0f0; text-shadow:0 2px 4px rgba(0,0,0,0.7); position:relative; display:inline-block; }
        .brand-logo-bottom::after { content:""; position:absolute; bottom:-8px; left:10%; width:80%; height:2px; background:linear-gradient(90deg,transparent,#B22222,transparent); }
        .branding-top { position:absolute; top:20px; right:20px; text-align:right; }
        .brand-logo-top img { height:50px; }
        .fade-in { animation: fadeIn 1.5s ease-in-out; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(20px);} to { opacity:1; transform:translateY(0);} }
        .instructions { margin-top:20px; font-size:0.9rem; color:#888; text-align:center; }
        .audio-controls { position:fixed; bottom:80px; left:20px; z-index:10; }
        .audio-btn { background: rgba(178,34,34,0.7); border:none; border-radius:50%; width:50px; height:50px; color:white; cursor:pointer; transition:all 0.3s ease; display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
        .audio-btn:hover { background: rgba(178,34,34,0.9); transform: scale(1.1);}
        @media(max-width:768px){
            .quote-text{font-size:1.6rem;}
            .quote-box{padding:40px 20px;}
            .brand-logo-bottom{font-size:1.4rem;}
            .branding-top{top:15px; right:15px;}
            .audio-controls{bottom:70px; left:15px;}
        }
    </style>
</head>
<body>
    <div class="background-image" id="backgroundImage"></div>

    <div class="branding-top">
        <div class="brand-logo-top">
            <img src="assets/upperlogo.png" alt="Logo">
        </div>
    </div>

    <div class="container">
        <div class="quote-box fade-in" id="quoteBox">
            <div class="quote-text" id="quoteText">"The only way to do great work is to love what you do."</div>
            <div class="quote-author" id="quoteAuthor">— Steve Jobs</div>
        </div>

        <div class="video-container fade-in" id="videoContainer" style="display:none;">
            <video class="motivational-video" id="motivationalVideo" controls muted>
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="instructions">Click anywhere or press Space for new inspiration</div>
    </div>

    <div class="branding-bottom">
        <div class="brand-logo-bottom">
            <img src="assets/lowerlogo.png" alt="Logo" style="height:50px;">
        </div>
    </div>

    <div class="audio-controls">
        <button class="audio-btn" id="audioToggle">
            <i class="fas fa-volume-up"></i>
        </button>
    </div>

    <audio id="backgroundAudio" loop>
        Your browser does not support the audio element.
    </audio>

    <script>
        const quotes = [
            { text:"The only way to do great work is to love what you do.", author:"Steve Jobs" },
            { text:"Your time is limited, so don't waste it living someone else's life.", author:"Steve Jobs" },
            { text:"The future belongs to those who believe in the beauty of their dreams.", author:"Eleanor Roosevelt" },
            { text:"Success is not final, failure is not fatal: it is the courage to continue that counts.", author:"Winston Churchill" },
            { text:"The way to get started is to quit talking and begin doing.", author:"Walt Disney" }
        ];

        const videos = [
            "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-sunset-over-a-stone-path-1175-large.mp4"
        ];

        const backgroundImages = [
            'https://images.unsplash.com/photo-1583237818726-0e9ac4d66ca5?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80',
            'https://images.unsplash.com/photo-1547981609-4b6bf67b3eac?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80',
            'https://images.unsplash.com/photo-1579546929662-711aa81148cf?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80'
        ];

        const audios = [
            'assets/audio/motivation1.mp3',
            'assets/audio/motivation2.mp3',
            'assets/audio/motivation3.mp3',
            'assets/audio/motivation4.mp3'
        ];

        let audioEnabled = true;
        let currentContentType = 'quote';

        function getRandomElement(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

        function displayRandomQuote(){
            const quote = getRandomElement(quotes);
            const quoteText = document.getElementById('quoteText');
            const quoteAuthor = document.getElementById('quoteAuthor');
            const quoteBox = document.getElementById('quoteBox');
            quoteBox.classList.remove('fade-in');
            setTimeout(()=>{
                quoteText.textContent = `"${quote.text}"`;
                quoteAuthor.textContent = `— ${quote.author}`;
                quoteBox.classList.add('fade-in');
                playRandomAudio();
            }, 300);
        }

        function displayRandomVideo(){
            const videoSrc = getRandomElement(videos);
            const videoEl = document.getElementById('motivationalVideo');
            const container = document.getElementById('videoContainer');
            container.classList.remove('fade-in');
            setTimeout(()=>{
                videoEl.src = videoSrc;
                container.classList.add('fade-in');
            }, 300);
        }

        function changeBackground(){
            const bg = document.getElementById('backgroundImage');
            bg.style.backgroundImage = `url('${getRandomElement(backgroundImages)}')`;
        }

        function toggleContent(){
            const quoteBox = document.getElementById('quoteBox');
            const videoContainer = document.getElementById('videoContainer');
            quoteBox.style.display = 'none';
            videoContainer.style.display = 'none';

            if(Math.random()<0.7){
                currentContentType='quote';
                quoteBox.style.display='block';
                displayRandomQuote();
            } else {
                currentContentType='video';
                videoContainer.style.display='block';
                displayRandomVideo();
            }

            changeBackground();
        }

        function playRandomAudio(){
            if(!audioEnabled || currentContentType!=='quote') return;
            const audio = document.getElementById('backgroundAudio');
            audio.src = getRandomElement(audios);
            audio.muted = true;
            audio.play().catch(e=>console.log("Audio blocked:",e));
        }

        function toggleAudio(){
            const audio = document.getElementById('backgroundAudio');
            const icon = document.getElementById('audioToggle').querySelector('i');
            if(audioEnabled){
                audio.pause(); audioEnabled=false; icon.className='fas fa-volume-mute';
            } else {
                if(currentContentType==='quote'){ audio.play().catch(e=>console.log(e)); }
                audioEnabled=true; icon.className='fas fa-volume-up';
            }
        }

        // Unmute on first user interaction
        document.addEventListener('click', ()=>{
            const audio = document.getElementById('backgroundAudio');
            if(audio.muted && currentContentType==='quote'){
                audio.muted=false;
                audio.play().catch(e=>console.log("Audio play blocked:",e));
            }
        }, {once:true});

        document.addEventListener('keydown', (e)=>{ if(e.code==='Space'){ e.preventDefault(); toggleContent(); }});
        document.addEventListener('click', (e)=>{ if(!e.target.closest('.audio-controls')) toggleContent(); });
        document.getElementById('audioToggle').addEventListener('click', toggleAudio);

        // Initialize
        toggleContent();
    </script>
</body>
</html>
