<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drotes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Poppins, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #0a0a0a;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            z-index: -1;
            transition: background-image 1.5s ease-in-out;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            z-index: 1;
            margin: auto;
        }
        
        .quote-box {
            background: rgba(20, 20, 20, 0.7);
            border-radius: 16px;
            padding: 80px 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(100, 100, 100, 0.2);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        
        .quote-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #8B0000, #B22222, #8B0000);
        }
        
        .quote-text {
            font-size: 2.2rem;
            line-height: 1.4;
            margin-bottom: 30px;
            font-weight: 300;
            color: #f8f8f8;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .quote-author {
            font-size: 1.3rem;
            color: #B22222;
            font-style: italic;
            font-weight: 400;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .branding-bottom {
            margin-top: auto;
            padding: 30px;
            text-align: center;
        }
        
        .brand-logo-bottom {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #f0f0f0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
            position: relative;
            display: inline-block;
        }
        
        .brand-logo-bottom::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #B22222, transparent);
        }
        
        .branding-top {
            position: absolute;
            top: 30px;
            right: 30px;
            text-align: right;
        }
        
        .brand-logo-top {
            font-size: 2.5rem;
            color: #B22222;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
            margin-bottom: 5px;
        }
        
        .fade-in {
            animation: fadeIn 1.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 768px) {
            .quote-text {
                font-size: 1.6rem;
            }
            
            .quote-box {
                padding: 60px 20px;
            }
            
            .brand-logo-bottom {
                font-size: 1.6rem;
            }
            
            .brand-logo-top {
                font-size: 2rem;
            }
            
            .branding-top {
                top: 20px;
                right: 20px;
            }
        }
        
        /* Samurai decorative elements */
        .samurai-decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            opacity: 0.1;
            z-index: -1;
        }
        
        .decoration-1 {
            top: 10%;
            left: 10%;
            transform: rotate(45deg);
        }
        
        .decoration-2 {
            bottom: 10%;
            right: 10%;
            transform: rotate(-45deg);
        }
        
        .decoration-3 {
            top: 10%;
            right: 10%;
            transform: rotate(135deg);
        }
        
        .decoration-4 {
            bottom: 10%;
            left: 10%;
            transform: rotate(-135deg);
        }
        
        .instructions {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="background-image" id="backgroundImage"></div>
    
    <!-- Samurai decorative elements -->
    <div class="samurai-decoration decoration-1">
        <i class="fas fa-hat-cowboy-side" style="font-size: 100px; color: #B22222;"></i>
    </div>
    <div class="samurai-decoration decoration-2">
        <i class="fas fa-hat-cowboy-side" style="font-size: 100px; color: #B22222;"></i>
    </div>
    <div class="samurai-decoration decoration-3">
        <i class="fas fa-hat-cowboy-side" style="font-size: 100px; color: #B22222;"></i>
    </div>
    <div class="samurai-decoration decoration-4">
        <i class="fas fa-hat-cowboy-side" style="font-size: 100px; color: #B22222;"></i>
    </div>
    
    <div class="branding-top">
        <!-- Replace with your logo image -->
        <!-- <img src="PATH_TO_YOUR_LOGO" alt="Logo" style="height: 60px;"> -->
        <div class="brand-logo-top">DROTES
            <i class="fas fa-spaghetti-monster-flying"></i>
        </div>
    </div>
    
    <div class="container">
        <div class="quote-box fade-in">
            <div class="quote-text" id="quoteText">"The only way to do great work is to love what you do."</div>
            <div class="quote-author" id="quoteAuthor">— Steve Jobs</div>
        </div>
        
        
    </div>
    
    <div class="branding-bottom">
        <!-- Replace with your logo image -->
        <!-- <img src="PATH_TO_YOUR_LOGO" alt="Logo" style="height: 50px;"> -->
        <div class="brand-logo-bottom">DROTES</div>
    </div>

    <script>
        const quotes = [
            {
                text: "The only way to do great work is to love what you do.",
                author: "Steve Jobs"
            },
            {
                text: "Your time is limited, so don't waste it living someone else's life.",
                author: "Steve Jobs"
            },
            {
                text: "The future belongs to those who believe in the beauty of their dreams.",
                author: "Eleanor Roosevelt"
            },
            {
                text: "Success is not final, failure is not fatal: it is the courage to continue that counts.",
                author: "Winston Churchill"
            },
            {
                text: "The way to get started is to quit talking and begin doing.",
                author: "Walt Disney"
            },
            {
                text: "It's not whether you get knocked down, it's whether you get up.",
                author: "Vince Lombardi"
            },
            {
                text: "I have not failed. I've just found 10,000 ways that won't work.",
                author: "Thomas Edison"
            },
            {
                text: "The mind is everything. What you think you become.",
                author: "Buddha"
            },
            {
                text: "The best time to plant a tree was 20 years ago. The second best time is now.",
                author: "Chinese Proverb"
            },
            {
                text: "You miss 100% of the shots you don't take.",
                author: "Wayne Gretzky"
            },
            {
                text: "In the midst of chaos, there is also opportunity.",
                author: "Sun Tzu"
            },
            {
                text: "The successful warrior is the average man, with laser-like focus.",
                author: "Bruce Lee"
            },
            {
                text: "The obstacle in the path becomes the path. Never forget, within every obstacle is an opportunity to improve our condition.",
                author: "Ryan Holiday"
            },
            {
                text: "Do not pray for an easy life, pray for the strength to endure a difficult one.",
                author: "Bruce Lee"
            },
            {
                text: "The bamboo that bends is stronger than the oak that resists.",
                author: "Japanese Proverb"
            }
        ];

        const backgroundImages = [
            'https://images.unsplash.com/photo-1583237818726-0e9ac4d66ca5?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80',
            'https://images.unsplash.com/photo-1547981609-4b6bf67b3eac?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80',
            'https://images.unsplash.com/photo-1579546929662-711aa81148cf?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80',
            'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80',
            'https://images.unsplash.com/photo-1550684376-efcbd6e3f031?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80'
        ];

        function getRandomElement(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function displayRandomQuote() {
            const randomQuote = getRandomElement(quotes);
            
            const quoteText = document.getElementById('quoteText');
            const quoteAuthor = document.getElementById('quoteAuthor');
            
            // Remove fade-in class for re-animation
            quoteText.parentElement.classList.remove('fade-in');
            
            setTimeout(() => {
                quoteText.textContent = `"${randomQuote.text}"`;
                quoteAuthor.textContent = `— ${randomQuote.author}`;
                
                // Re-add fade-in class
                quoteText.parentElement.classList.add('fade-in');
            }, 300);
        }

        function changeBackground() {
            const backgroundImage = document.getElementById('backgroundImage');
            const randomImage = getRandomElement(backgroundImages);
            
            backgroundImage.style.backgroundImage = `url('${randomImage}')`;
        }

        // Initialize with random quote and background
        displayRandomQuote();
        changeBackground();

        // Event listeners
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault();
                displayRandomQuote();
                changeBackground();
            }
        });

        // Change quote and background on click/tap
        document.addEventListener('click', () => {
            displayRandomQuote();
            changeBackground();
        });
    </script>
</body>
</html>
