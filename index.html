<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samurai Wisdom</title>
    
    <!-- Google Fonts: Oswald -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            z-index: -1;
            transition: background-image 1.5s ease-in-out;
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            z-index: 1;
            margin: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .quote-box {
            background: rgba(20, 20, 20, 0.7);
            border-radius: 16px;
            padding: 60px 40px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(100,100,100,0.2);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
            width: 100%;
            max-width: 800px;
        }

        .quote-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #8B0000, #B22222, #8B0000);
        }

        .quote-text {
            font-size: 2.2rem;
            line-height: 1.4;
            margin-bottom: 30px;
            font-weight: 400;
            color: #f8f8f8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .quote-author {
            font-size: 1.3rem;
            color: #B22222;
            font-style: italic;
            font-weight: 400;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .video-container {
            width: 100%;
            max-width: 800px;
            background: rgba(20,20,20,0.7);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(100,100,100,0.2);
            backdrop-filter: blur(5px);
            position: relative;
        }

        .video-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #8B0000, #B22222, #8B0000);
        }

        .motivational-video {
            width: 100%;
            border-radius: 8px;
            max-height: 450px;
        }

        .branding-bottom {
            padding: 20px;
            text-align: center;
            margin-top: auto;
        }

        .branding-top {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
        }

        .fade-in {
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .audio-controls {
            position: fixed;
            bottom: 80px;
            left: 20px;
            z-index: 10;
        }

        .audio-btn {
            background: rgba(178, 34, 34, 0.7);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .audio-btn:hover {
            background: rgba(178, 34, 34, 0.9);
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .quote-text { font-size: 1.6rem; }
            .quote-box { padding: 40px 20px; }
            .audio-controls { bottom: 70px; left: 15px; }
        }
    </style>
</head>
<body>

    <div class="background-image" id="backgroundImage"></div>

    <!-- Top Logo -->
    <div class="branding-top">
        <img src="assets/upperlogo.png" alt="Top Logo" style="height: 50px;">
    </div>

    <div class="container">
        <div class="quote-box fade-in" id="quoteBox">
            <div class="quote-text" id="quoteText">"The only way to do great work is to love what you do."</div>
            <div class="quote-author" id="quoteAuthor">— Steve Jobs</div>
        </div>

        <div class="video-container fade-in" id="videoContainer" style="display: none;">
            <video class="motivational-video" id="motivationalVideo" controls autoplay muted>
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <!-- Bottom Logo -->
    <div class="branding-bottom">
        <img src="assets/lowerlogo.png" alt="Bottom Logo" style="height: 40px;">
    </div>

    <!-- Audio controls -->
    <div class="audio-controls">
        <button class="audio-btn" id="audioToggle">
            <i class="fas fa-volume-up"></i>
        </button>
    </div>

    <audio id="backgroundAudio" loop></audio>

    <script>
        const quotes = [
            {text: "The only way to do great work is to love what you do.", author: "Steve Jobs"},
            {text: "Your time is limited, so don't waste it living someone else's life.", author: "Steve Jobs"},
            {text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt"},
            {text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill"},
            {text: "The way to get started is to quit talking and begin doing.", author: "Walt Disney"},
            {text: "It's not whether you get knocked down, it's whether you get up.", author: "Vince Lombardi"}
        ];

        const videos = [
            "https://www.w3schools.com/html/mov_bbb.mp4"
        ];

        const backgroundImages = [
            'https://images.unsplash.com/photo-1583237818726-0e9ac4d66ca5?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80',
            'https://images.unsplash.com/photo-1547981609-4b6bf67b3eac?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80'
        ];

        const audios = [
            "assets/audio/motivation1.mp3",
            "assets/audio/motivation2.mp3",
            "assets/audio/motivation3.mp3",
            "assets/audio/motivation4.mp3"
        ];

        let audioEnabled = true;
        let currentContentType = 'quote';

        function getRandomElement(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function displayRandomQuote() {
            const quote = getRandomElement(quotes);
            const quoteText = document.getElementById('quoteText');
            const quoteAuthor = document.getElementById('quoteAuthor');
            const quoteBox = document.getElementById('quoteBox');

            quoteBox.classList.remove('fade-in');
            setTimeout(() => {
                quoteText.textContent = `"${quote.text}"`;
                quoteAuthor.textContent = `— ${quote.author}`;
                quoteBox.classList.add('fade-in');
            }, 200);

            playRandomAudio();
        }

        function displayRandomVideo() {
            const videoElement = document.getElementById('motivationalVideo');
            videoElement.src = getRandomElement(videos);
        }

        function changeBackground() {
            const bg = document.getElementById('backgroundImage');
            bg.style.backgroundImage = `url('${getRandomElement(backgroundImages)}')`;
        }

        function toggleContent() {
            const quoteBox = document.getElementById('quoteBox');
            const videoContainer = document.getElementById('videoContainer');

            quoteBox.style.display = 'none';
            videoContainer.style.display = 'none';

            if (Math.random() < 0.7) {
                currentContentType = 'quote';
                quoteBox.style.display = 'block';
                displayRandomQuote();
            } else {
                currentContentType = 'video';
                videoContainer.style.display = 'block';
                displayRandomVideo();
            }

            changeBackground();
        }

        function playRandomAudio() {
            if (!audioEnabled || currentContentType !== 'quote') return;
            const audio = document.getElementById('backgroundAudio');
            audio.src = getRandomElement(audios);
            audio.play().catch(e => console.log("Audio play failed:", e));
        }

        function toggleAudio() {
            const audio = document.getElementById('backgroundAudio');
            const icon = document.getElementById('audioToggle').querySelector('i');

            if (audioEnabled) {
                audio.pause();
                icon.className = 'fas fa-volume-mute';
                audioEnabled = false;
            } else {
                audio.play().catch(e => console.log("Audio play failed:", e));
                icon.className = 'fas fa-volume-up';
                audioEnabled = true;
            }
        }

        // Initialize
        toggleContent();

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleContent();
            }
        });

        document.addEventListener('click', e => {
            if (!e.target.closest('.audio-controls')) toggleContent();
        });

        document.getElementById('audioToggle').addEventListener('click', toggleAudio);

    </script>
</body>
</html>
